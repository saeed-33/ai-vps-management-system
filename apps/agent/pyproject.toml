[project]
name = "ai-vps-agent"
version = "0.1.0"
description = "Agent runtime foundation for periodic VPS monitoring reports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0,<9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_vps_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
